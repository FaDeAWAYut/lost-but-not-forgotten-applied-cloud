<!DOCTYPE html>
<html>
  <head>
    <title>LBNF - Looking for Item</title>
    <link rel="stylesheet" href="/palette.css">
    <link rel="stylesheet" href="/form.css">
  </head>
  <body>
    <button type="button" class="back-btn" id="homeBtn">← Back to Home</button>

    <h1>Search for something you're looking for</h1>

    <form id="searchForm">
      <div>
        <label for="searchQuery">Item Name</label><br>
        <input type="text" id="searchQuery" name="searchQuery">
      </div>

      <button type="button" id="searchBtn">Search</button>
    </form>

    <h2>Reported Items</h2>
    <ul id="itemList" class="item-list"></ul>

    <script>
      document.getElementById('homeBtn').addEventListener('click', () => {
        window.location.href = '/';
      });

      async function loadItems(searchTerm = '') {
        try {
          const url = searchTerm
            ? `/items?search=${encodeURIComponent(searchTerm)}`
            : '/items';
          const response = await fetch(url);
          const items = await response.json();

          const list = document.getElementById('itemList');
          list.innerHTML = '';

          if (items.length === 0) {
            list.innerHTML = '<li>No items found.</li>';
            return;
          }

          items.forEach(item => {
            const li = document.createElement('li');
            li.className = 'item-card';
            li.innerHTML = `
              <b>${item.itemName}</b>
              <div>${item.description}</div>
              <div class="meta">Found at: ${item.locationFound}</div>
              <div class="meta">Contact: ${item.contactInfo}</div>
            `;
            list.appendChild(li);
          });
        } catch (err) {
          console.error('Error loading items:', err);
          document.getElementById('itemList').innerHTML = '<li>Could not load items.</li>';
        }
      }

      document.getElementById('searchBtn').addEventListener('click', () => {
        const query = document.getElementById('searchQuery').value;
        loadItems(query);
      });

      loadItems();
    </script>
  </body>
</html>
